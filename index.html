<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #fee2e2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-cursive { font-family: 'Dancing Script', cursive; }
        .card { transition: all 0.3s ease; }
        .card.selected { border-color: #f472b6; background-color: #fdf2f8; transform: scale(1.05); }
        .hidden { display: none; }
        .heart { position: fixed; font-size: 1.5rem; animation: floatUp 4s linear forwards; pointer-events: none; z-index: 50;}
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative">

    <!-- MAIN APP -->
    <div id="mainApp" class="bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-xl w-full max-w-md my-8 border border-white relative z-10">
        <h1 class="text-4xl font-cursive text-pink-500 text-center mb-2">Our Perfect Date</h1>
        <p class="text-center text-gray-500 text-sm mb-6">Design our next adventure together ✨</p>

        <!-- Step 1: Activity -->
        <div class="mb-6">
            <h2 class="text-sm font-semibold text-pink-600 mb-3 uppercase tracking-wider">1. What are we doing?</h2>
            <div class="grid grid-cols-2 gap-3">
                <div onclick="selectActivity('Rides')" id="act-Rides" class="card border-2 border-transparent bg-white p-4 rounded-xl cursor-pointer text-center shadow-sm hover:shadow-md">
                    <div class="text-2xl mb-1">🛵</div><div class="text-sm font-medium">Rides</div>
                </div>
                <div onclick="selectActivity('Overnight')" id="act-Overnight" class="card border-2 border-transparent bg-white p-4 rounded-xl cursor-pointer text-center shadow-sm hover:shadow-md">
                    <div class="text-2xl mb-1">🌙</div><div class="text-sm font-medium">Overnight</div>
                </div>
                <div onclick="selectActivity('Visit')" id="act-Visit" class="card border-2 border-transparent bg-white p-4 rounded-xl cursor-pointer text-center shadow-sm hover:shadow-md">
                    <div class="text-2xl mb-1">🏠</div><div class="text-sm font-medium">Visit</div>
                </div>
                <div onclick="selectActivity('Eat')" id="act-Eat" class="card border-2 border-transparent bg-white p-4 rounded-xl cursor-pointer text-center shadow-sm hover:shadow-md">
                    <div class="text-2xl mb-1">🍽️</div><div class="text-sm font-medium">Eat</div>
                </div>
            </div>
        </div>

        <div id="dynamicSection" class="hidden mb-6 bg-white p-4 rounded-xl border border-pink-100 shadow-sm"></div>

        <div id="dateTimeSection" class="hidden mb-8 grid grid-cols-2 gap-4">
            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase">Date</label>
                <input type="date" id="dateInput" class="w-full mt-1 p-2 border rounded-lg focus:outline-none focus:border-pink-400 text-sm">
            </div>
            <div>
                <label id="timeLabel" class="text-xs font-semibold text-gray-500 uppercase">Time</label>
                <input type="time" id="timeInput" class="w-full mt-1 p-2 border rounded-lg focus:outline-none focus:border-pink-400 text-sm">
            </div>
        </div>

        <button onclick="submitDate()" id="submitBtn" class="w-full py-3 rounded-full font-semibold text-white bg-gray-300 cursor-not-allowed transition-all duration-300" disabled>
            Pick an activity first!
        </button>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="successScreen" class="hidden bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-xl w-full max-w-md text-center border border-white z-10">
        <div class="text-6xl mb-4">💖</div>
        <h2 class="text-3xl font-cursive text-pink-500 mb-2">I can't wait!</h2>
        <p class="text-gray-600 mb-4">Your date has been set. See you then, beautiful! ✨</p>
        <p id="summaryText" class="text-sm font-medium text-pink-600 bg-pink-50 p-3 rounded-lg border border-pink-200"></p>
    </div>

    <script>
        let selection = { activity: '', detail: '', date: '', time: '' };

        function selectActivity(act) {
            selection.activity = act;
            selection.detail = ''; 
            
            document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
            document.getElementById('act-' + act).classList.add('selected');

            const dyn = document.getElementById('dynamicSection');
            dyn.classList.remove('hidden');
            document.getElementById('dateTimeSection').classList.remove('hidden');
            
            let html = '';
            if(act === 'Rides') {
                html = `<label class="text-xs font-semibold text-pink-600 uppercase">Where are we riding to?</label>
                        <input type="text" id="detailInput" onchange="updateDetail(this.value)" placeholder="e.g. Tagaytay, Beach..." class="w-full mt-2 p-2 border rounded-lg text-sm">`;
                document.getElementById('timeLabel').innerText = "Time";
            } else if(act === 'Overnight') {
                html = `<p class="text-sm text-gray-600 font-medium text-center">Yay! Movie marathon and cuddles! 🍿</p>`;
                selection.detail = 'Cuddles & Movies';
                document.getElementById('timeLabel').innerText = "Time coming over 🏠";
            } else if(act === 'Visit') {
                html = `<label class="text-xs font-semibold text-pink-600 uppercase mb-2 block">Whose house?</label>
                        <div class="flex gap-2">
                            <button onclick="updateDetail('My House')" class="detail-btn flex-1 py-2 border rounded-lg text-sm">My House 👱‍♂️</button>
                            <button onclick="updateDetail('Her House')" class="detail-btn flex-1 py-2 border rounded-lg text-sm">Your House 👩</button>
                        </div>`;
                document.getElementById('timeLabel').innerText = "Time";
            } else if(act === 'Eat') {
                html = `<label class="text-xs font-semibold text-pink-600 uppercase mb-2 block">What are you craving?</label>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <button onclick="updateDetail('Streetfoods')" class="detail-btn py-1 border rounded">🍢 Streetfoods</button>
                            <button onclick="updateDetail('Samgyup')" class="detail-btn py-1 border rounded">🥓 Samgyup</button>
                            <button onclick="updateDetail('Pizza & Fries')" class="detail-btn py-1 border rounded">🍕 Pizza & Fries</button>
                            <button onclick="updateDetail('Ice Cream')" class="detail-btn py-1 border rounded">🍦 Ice Cream</button>
                        </div>`;
                document.getElementById('timeLabel').innerText = "Time";
            }
            dyn.innerHTML = html;
            checkReady();
        }

        function updateDetail(val) {
            selection.detail = val;
            document.querySelectorAll('.detail-btn').forEach(btn => btn.classList.remove('bg-pink-100', 'border-pink-400'));
            if(event && event.target.classList.contains('detail-btn')) {
                event.target.classList.add('bg-pink-100', 'border-pink-400');
            }
            checkReady();
        }

        document.getElementById('dateInput').addEventListener('change', checkReady);
        document.getElementById('timeInput').addEventListener('change', checkReady);

        function checkReady() {
            selection.date = document.getElementById('dateInput').value;
            selection.time = document.getElementById('timeInput').value;
            
            const btn = document.getElementById('submitBtn');
            if(selection.activity && selection.date && selection.time && (selection.activity === 'Overnight' || selection.detail !== '')) {
                btn.disabled = false;
                btn.className = "w-full py-3 rounded-full font-bold text-white bg-gradient-to-r from-pink-400 to-pink-500 shadow-lg transform hover:-translate-y-0.5 transition-all";
                btn.innerText = "Confirm Date! 💖";
            }
        }

        function submitDate() {
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Sending... 💌";

            // ==========================================
            aec85106-f4df-4783-a23f-35825e916a5f
            // ==========================================
            const accessKey = "YOUR_ACCESS_KEY_HERE"; 

            const payload = {
                access_key: accessKey,
                subject: "❤️ New Date Request from Your GF! ❤️",
                message: `Activity: ${selection.activity}\nDetails/Location: ${selection.detail}\nDate: ${selection.date}\nTime: ${selection.time}`
            };

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(async (response) => {
                if (response.status === 200) {
                    document.getElementById('mainApp').classList.add('hidden');
                    document.getElementById('successScreen').classList.remove('hidden');
                    document.getElementById('summaryText').innerText = `${selection.activity} (${selection.detail}) on ${selection.date} at ${selection.time}`;
                    for(let i=0; i<40; i++) setTimeout(createHeart, i*50);
                } else {
                    alert("Something went wrong!");
                    btn.innerText = "Try Again";
                }
            })
            .catch(error => {
                alert("Error sending email.");
                btn.innerText = "Try Again";
            });
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = ['❤️', '💖', '✨', '💕'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 800);
    </script>
</body>
</html>
